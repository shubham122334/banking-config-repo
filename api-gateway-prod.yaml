
spring:
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
          routes:
            # - id: account-service
            #   uri: lb://ACCOUNT-SERVICE
            #   predicates:
            #     - Path=/api/account/**
            #   filters:
            #     - StripPrefix=1
            # - id: transaction-service
            #   uri: lb://TRANSACTION-SERVICE
            #   predicates:
            #     - Path=/api/transaction/**
            #   filters:
            #     - StripPrefix=1
            #     - name: CircuitBreaker
            #       args:
            #         name: transactionCB
            #         fallbackUri: forward:/fallback/transaction
            - id: auth-server
              uri: lb://AUTH-SERVER
              predicates:
                - Path=/auth/**,/oauth2/**
              filters:
                - StripPrefix=1
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info, metrics
